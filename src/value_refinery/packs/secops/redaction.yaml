version: 0.0.1
redactions:
  - id: email
    kind: regex
    pattern: "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}"
    replace: "[REDACTED_EMAIL]"
  - id: ipv4
    kind: regex
    pattern: "\\b(\\d{1,3}\\.){3}\\d{1,3}\\b"
    replace: "[REDACTED_IP]"
  - id: aws_key
    kind: regex
    pattern: "\\bAKIA[0-9A-Z]{16}\\b"
    replace: "[REDACTED_AWS_KEY]"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-refinery"
version = "0.0.1"
description = "Value Refinery - data refinement pipeline for AI training (core + vertical packs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12.0", "PyYAML>=6.0.1", "duckdb>=0.10.0", "rich>=13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
value-refinery = "value_refinery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
value_refinery = ["packs/**/*.yaml"]
